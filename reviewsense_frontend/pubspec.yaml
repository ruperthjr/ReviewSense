name: reviewsense_frontend
description: "ReviewSense Flutter app with NFT-style dark theme"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.2.7
  dio: ^5.5.0
  drift: ^2.19.1
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0
  flutter_native_splash: ^2.4.1
  logger: ^2.3.0
  dartz: ^0.10.1
  intl: ^0.19.0

  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  sensors_plus: ^6.0.0

  lottie: ^3.1.2
  flutter_staggered_animations: ^1.1.0
  cached_network_image: ^3.3.1
  google_fonts: ^6.2.1
  share_plus: ^9.0.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.12
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  drift_dev: ^2.19.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/brand/logo.png
    - assets/images/brand/logo_dark.png
    - assets/animations/lottie/analyzing_pulse.json
    - assets/animations/lottie/result_success.json
    - assets/animations/lottie/empty_history.json

  fonts:
    - family: Syne
      fonts:
        - asset: assets/fonts/Syne/Syne-Regular.ttf
        - asset: assets/fonts/Syne/Syne-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Syne/Syne-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter-Regular.ttf
        - asset: assets/fonts/Inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter/Inter-SemiBold.ttf
          weight: 600