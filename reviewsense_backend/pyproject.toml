[tool.poetry]
name = "reviewsense-backend"
version = "0.1.0"
description = "ReviewSense AI backend for sentiment and authenticity analysis"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
sqlalchemy = "^2.0.30"
asyncpg = "^0.29.0"
aiosqlite = {version = "^0.20.0", optional = true}  # for testing
pydantic = "^2.7.0"
pydantic-settings = "^2.2.0"
python-dotenv = "^1.0.0"
psycopg2-binary = "^2.9.9"  # for SQLAlchemy sync (optional)
httpx = "^0.27.0"
transformers = "^4.41.0"
torch = "^2.3.0"  # required by transformers
lightgbm = "^4.3.0"
numpy = "^1.26.0"
scipy = "^1.13.0"  # often needed by lightgbm
python-multipart = "^0.0.9"  # for form data if needed

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^5.0.0"
black = "^24.4.0"
isort = "^5.13.0"
flake8 = "^7.0.0"
mypy = "^1.10.0"
pre-commit = "^3.7.0"

[tool.poetry.extras]
test = ["aiosqlite"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"